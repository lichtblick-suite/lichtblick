approvedGitRepositories:
  - "github.com/lichtblick-suite/*"

changesetBaseRefs:
  - main
  - origin/main

compressionLevel: mixed

defaultSemverRangePrefix: ""

enableGlobalCache: false

enableScripts: true

nodeLinker: node-modules

# High-severity advisories with no patched release yet. Both packages are only pulled in by
# build tooling (webpack, Storybook, electron-builder), not by shipped app code. Yarn can only
# ignore by advisory ID across the whole workspace, so remove each entry as soon as a fixed
# version is published.
npmAuditIgnoreAdvisories:
  # braces <=3.0.3 (GHSA-vfj7-8cjw-p6xm), via micromatch, and chokidar from webpack-dev-server
  # and fork-ts-checker-webpack-plugin
  - "1240992"
  # http-cache-semantics <=4.2.0 (GHSA-ch52-4w7c-c8xp), via electron-builder -> @electron/get -> got
  - "1240991"

npmMinimalAgeGate: 0

patchFolder: ./patches

yarnPath: .yarn/yarn-wrapper.js
