# CORS-enabling reverse proxy in front of Loki, solely so `docs/telemetry/poc/heatmap/index.html`
# (a plain static file with no build step, opened directly or served from a different origin than
# Loki) can call Loki's `query_range` HTTP API from the browser. Loki itself has no CORS
# configuration option — verified against the full Loki configuration reference, which has no
# `cors`-related key anywhere — so this exists purely to add the missing
# `Access-Control-Allow-Origin` header. Not part of the app's own telemetry path (that goes
# app -> otel-collector, which already sets `cors.allowed_origins` itself, see otel-collector.yaml)
# and not for production use.
server {
    listen 3100;

    location / {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://loki:3100;
    }
}
