# PoC stack — not for production use.
# Usage: docker compose -f docs/telemetry/poc/docker-compose.yml up
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4318:4318" # OTLP HTTP receiver (app talks to this)
    depends_on:
      - prometheus
      - loki

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"

  # CORS shim in front of Loki, for docs/telemetry/poc/heatmap/index.html only — Loki itself has
  # no CORS support (see nginx-cors-proxy.conf). Grafana's own Loki queries go through its
  # server-side datasource proxy instead, so they never need this.
  loki-cors-proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx-cors-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3101:3100"
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
