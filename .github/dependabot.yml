version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      # We found daily updates to be too noisy. They consumed too much CI time and engineer review
      # time relative to the benefit of being on such a bleeding edge.
      interval: weekly
    open-pull-requests-limit: 20
    labels: [dependabot]
    target-branch: "develop"
    # Compromised releases are usually yanked within days; security updates skip the cooldown.
    cooldown:
      default-days: 7
      semver-major-days: 30

    # Define groups of dependencies to be updated together
    # https://github.blog/changelog/2023-06-30-grouped-version-updates-for-dependabot-public-beta/
    groups:
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      eslint:
        patterns:
          - "@typescript-eslint/*"
      emotion:
        patterns:
          - "@emotion/*"
      electron:
        patterns:
          - "electron"
          - "electron-*"
          - "app-builder-lib"
          - "builder-util"
      jest:
        patterns:
          - "jest"
          - "jest-*"
          - "babel-jest"
          - "@types/jest"
      webpack:
        patterns:
          - "webpack"
          - "webpack-cli"
          - "webpack-dev-server"
      babel:
        patterns:
          - "@babel/*"
      monaco-editor:
        patterns:
          - "monaco-editor"
          - "monaco-editor-webpack-plugin"
          - "react-monaco-editor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels: [dependabot]
    cooldown:
      default-days: 7
