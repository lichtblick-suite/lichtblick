name: E2E Benchmark

# Runs the benchmark E2E suite (benchmark/e2e) on Electron and web, collecting process metrics,
# in-app telemetry and frame times. Results, screenshots and the HTML report are uploaded as
# artifacts. Runs on pushes to long-lived branches (the suite is slow and needs a stable runner) and
# on manual dispatch. Push runs run the scenarios spec only. A manual run can choose the long-running
# telemetry overhead A/B (overhead spec) instead, its method and sample counts, and the platforms
# (see benchmark/README.md, "CI").

on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      suite:
        description: "Spec to run: scenarios, or overhead (telemetry overhead A/B, about 40 min per platform locally)"
        type: choice
        options: [scenarios, overhead]
        default: scenarios
      platform:
        description: "Platforms to run"
        type: choice
        options: [both, electron, web]
        default: both
      method:
        description: "Overhead only: A/B method (BENCHMARK_OVERHEAD_METHOD)"
        type: choice
        options: [both, toggle, relaunch]
        default: both
      quartets:
        description: "Overhead only: toggle ABBA quartets (BENCHMARK_OVERHEAD_TOGGLE_QUARTETS; blank = default 10, min 4)"
        type: string
        default: ""
      repeats:
        description: "Overhead only: relaunch repeats per arm (BENCHMARK_OVERHEAD_REPEATS; blank = default 8, a verdict needs 6)"
        type: string
        default: ""

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e-benchmark:
    runs-on: ubuntu-latest

    name: e2e-benchmark (ubuntu-latest)
    if: ${{ inputs.platform != 'web' }}
    # The overhead A/B is long-running (about 40 min per platform locally with the defaults).
    timeout-minutes: ${{ inputs.suite == 'overhead' && 240 || 360 }}

    # Set a fixed timezone to ensure consistent test results. Push runs have no inputs: scenarios
    # spec, and blank overhead knobs fall back to the spec's defaults.
    env:
      TZ: Europe/Lisbon
      BENCHMARK_SUITE: ${{ inputs.suite || 'scenarios' }}
      BENCHMARK_OVERHEAD_METHOD: ${{ inputs.method }}
      BENCHMARK_OVERHEAD_TOGGLE_QUARTETS: ${{ inputs.quartets }}
      BENCHMARK_OVERHEAD_REPEATS: ${{ inputs.repeats }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable yarn

      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            **/node_modules
          key: v5-${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: v5-${{ runner.os }}-yarn-

      - run: yarn install --immutable

      - name: Apply AppArmor Fix (Ubuntu)
        # Required for Playwright/Electron on Ubuntu to work properly
        # See: https://github.com/microsoft/playwright/issues/34251
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build benchmark desktop app
        run: yarn benchmark:desktop:build:prod

      - name: Run Benchmark E2E tests
        uses: coactions/setup-xvfb@v1
        with:
          working-directory: ./
          # The action runs the command without a shell: `suite` is a choice input, so safe here.
          run: yarn test:e2e:benchmark:ci ${{ env.BENCHMARK_SUITE }}

      - name: Generate Benchmark Test Summary
        if: always()
        run: yarn test:e2e:benchmark:summary >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Benchmark HTML Report
        if: always()
        run: |
          yarn test:e2e:benchmark:viewer
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📊 Interactive report: download artifact \`benchmark-results-electron\` and open \`report/index.html\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Benchmark Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-electron
          # Generated MCAP fixtures are reproducible, so they are not uploaded.
          path: |
            benchmark/.artifacts/**/*.json
            benchmark/.artifacts/screenshots/**
            benchmark/.artifacts/report/**
            !benchmark/.artifacts/fixtures/**
          if-no-files-found: warn
          include-hidden-files: true

  e2e-benchmark-web:
    runs-on: ubuntu-latest

    name: e2e-benchmark-web (ubuntu-latest)
    if: ${{ inputs.platform != 'electron' }}
    timeout-minutes: ${{ inputs.suite == 'overhead' && 240 || 360 }}

    # Set a fixed timezone to ensure consistent test results. Push runs have no inputs: scenarios
    # spec, and blank overhead knobs fall back to the spec's defaults.
    env:
      TZ: Europe/Lisbon
      BENCHMARK_SUITE: ${{ inputs.suite || 'scenarios' }}
      BENCHMARK_OVERHEAD_METHOD: ${{ inputs.method }}
      BENCHMARK_OVERHEAD_TOGGLE_QUARTETS: ${{ inputs.quartets }}
      BENCHMARK_OVERHEAD_REPEATS: ${{ inputs.repeats }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable yarn

      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            **/node_modules
          key: v5-${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: v5-${{ runner.os }}-yarn-

      - run: yarn install --immutable

      - name: Build benchmark web app
        run: yarn benchmark:build:prod

      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium

      - name: Run Benchmark E2E tests (web)
        run: yarn test:e2e:benchmark:web:ci "$BENCHMARK_SUITE"

      - name: Generate Benchmark Test Summary
        if: always()
        run: yarn test:e2e:benchmark:summary >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Benchmark HTML Report
        if: always()
        run: |
          yarn test:e2e:benchmark:viewer
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📊 Interactive report: download artifact \`benchmark-results-web\` and open \`report/index.html\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Benchmark Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-web
          # Generated MCAP fixtures are reproducible, so they are not uploaded.
          path: |
            benchmark/.artifacts/**/*.json
            benchmark/.artifacts/screenshots/**
            benchmark/.artifacts/report/**
            !benchmark/.artifacts/fixtures/**
          if-no-files-found: warn
          include-hidden-files: true
